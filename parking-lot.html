<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>ผังลานจอดรถ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: แถบบนสุด (โลโก้ + ผู้ใช้) → แถบสรุปความจุ → ผังลานบนพื้นยางมะตอย (ซ้าย) + แผงรายละเอียด (ขวา); มือถือเรียงเป็นคอลัมน์เดียว */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --fg:#14202b; --muted:#5c6b78; --line:#d9e0e6;
  --brand:#1d4ed8; --brand-ink:#ffffff;
  --free:#22c55e; --free-deep:#15803d; --free-soft:#dcfce7;
  --full:#ef4444; --full-deep:#b91c1c; --full-soft:#fee2e2;
  /* ผังลานใช้พื้นยางมะตอยเข้มทั้งสองธีม */
  --asphalt:#1e2731; --asphalt-2:#26313c; --paint:#e8edf2; --paint-dim:#6f7d8a; --bldg:#334150; --bldg-line:#55687a;
  --focus:#fbbf24;
  --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Sukhumvit Set",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1319; --surface:#151d25; --surface-2:#1b252f; --fg:#e7edf3; --muted:#93a3b2; --line:#26323d;
  --brand:#6b93ff; --brand-ink:#0b1220;
  --free:#34d36b; --free-deep:#4ade80; --free-soft:#12301d;
  --full:#f25c5c; --full-deep:#fca5a5; --full-soft:#3a1818;
  --asphalt:#111920; --asphalt-2:#18222b; --paint:#d6dee6; --paint-dim:#55636f; --bldg:#24313d; --bldg-line:#435566;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1319; --surface:#151d25; --surface-2:#1b252f; --fg:#e7edf3; --muted:#93a3b2; --line:#26323d;
  --brand:#6b93ff; --brand-ink:#0b1220;
  --free:#34d36b; --free-deep:#4ade80; --free-soft:#12301d;
  --full:#f25c5c; --full-deep:#fca5a5; --full-soft:#3a1818;
  --asphalt:#111920; --asphalt-2:#18222b; --paint:#d6dee6; --paint-dim:#55636f; --bldg:#24313d; --bldg-line:#435566;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
input,select,button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.slot:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- ป้าย P ---------- */
.logo{display:flex;align-items:center;gap:12px}
.p-sign{width:40px;height:40px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.35rem;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.logo h1{font-size:1.25rem;font-weight:600;line-height:1.2}
.logo small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:400}

/* ---------- หน้าล็อกอิน ---------- */
.login{max-width:440px;margin:4vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.login-hero{background:var(--asphalt);padding:22px 24px 0;position:relative}
.login-hero .logo h1{color:#fff}
.login-hero .logo small{color:#a9b6c2}
.lot-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin-top:20px;border-top:2px solid var(--paint);height:58px}
.lot-strip i{border-right:2px solid var(--paint);display:grid;place-items:center}
.lot-strip i:first-child{border-left:2px solid var(--paint)}
.lot-strip i::after{content:"";width:58%;height:70%;border-radius:6px 6px 3px 3px;background:var(--full);opacity:.9}
.lot-strip i.f::after{background:transparent;border:2px dashed var(--free);opacity:1}
.login-body{padding:22px 24px 26px;display:grid;gap:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:7px;padding:9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.88rem;font-weight:500}
.field input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:var(--mono);font-size:1rem;letter-spacing:.06em;transition:border-color .15s}
.field input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.counter{font-family:var(--mono);font-size:.75rem;color:var(--muted);justify-self:end;margin-top:-2px}
.counter.ok{color:var(--free-deep)}
.err{font-size:.85rem;color:var(--full-deep);background:var(--full-soft);border-radius:8px;padding:8px 12px;margin:0}
.err:empty{display:none}
.primary{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:12px;font-weight:600;font-family:var(--display);font-size:1rem;cursor:pointer;transition:transform .1s,filter .15s}
.primary:hover{filter:brightness(1.08)}
.primary:active{transform:translateY(1px)}

/* ---------- แอป ---------- */
.wrap{max-width:1260px;margin:0 auto;display:grid;gap:16px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 14px;font-size:.88rem}
.who b{font-family:var(--mono);font-weight:500}
.role{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--brand);color:var(--brand-ink)}
.role.stu{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.ghost{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.84rem;color:var(--fg)}
.ghost:hover{border-color:var(--muted)}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;box-shadow:var(--shadow)}
@media (max-width:620px){.summary{grid-template-columns:minmax(0,1fr)}}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--free-deep);font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.big-lbl{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.meter-row{display:grid;gap:8px}
.meter{height:12px;border-radius:99px;background:var(--full);overflow:hidden;display:flex}
.meter i{background:var(--free);height:100%;transition:width .4s}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--muted)}
.legend b{color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

.mapcard{background:var(--asphalt);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 4px 12px}
.search{flex:1 1 200px;position:relative}
.search input{width:100%;background:var(--asphalt-2);border:1px solid #3a4856;color:#e8edf2;border-radius:10px;padding:9px 12px 9px 36px}
.search input::placeholder{color:#8695a3}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#8695a3;fill:none;stroke-width:2}
.chips{display:flex;gap:6px}
.chip{border:1px solid #3a4856;background:var(--asphalt-2);color:#c5d0da;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:.86rem;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:#e8edf2;color:#14202b;border-color:#e8edf2;font-weight:600}
.mapscroll{overflow-x:auto;border-radius:10px}
#map{display:block;width:100%;height:auto;min-width:360px}

.slot{cursor:pointer}
.slot .pad{stroke:var(--paint);stroke-width:1.6;fill:var(--asphalt-2)}
.slot .fill{transition:fill .2s,opacity .2s}
.slot.free .fill{fill:var(--free)}
.slot.full .fill{fill:var(--full)}
.slot .num{font-family:var(--mono);font-weight:700;font-size:10px;fill:#0b2a16;pointer-events:none}
.slot .car{fill:#fff;opacity:.9;pointer-events:none}
.slot:hover .fill{filter:brightness(1.15)}
.slot.sel .pad{stroke:var(--focus);stroke-width:4}
.slot.dim{opacity:.15}
.slot:focus{outline:none}
.slot:focus-visible .pad{stroke:var(--focus);stroke-width:4}

.bldg{fill:var(--bldg);stroke:var(--bldg-line);stroke-width:2}
.wall{stroke:var(--paint-dim);stroke-width:3;fill:none;stroke-linecap:round}
.lane{stroke:var(--paint-dim);stroke-width:2;fill:none;stroke-dasharray:10 8}
.arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah);opacity:.75}
.road{fill:#0c1218}
.road-line{stroke:#c9a227;stroke-width:2;stroke-dasharray:14 10;fill:none;opacity:.7}
.lbl{font-family:var(--display);font-weight:600;fill:#d6dee6;font-size:26px}
.zone{font-family:var(--mono);font-weight:700;fill:#c9d3dc;font-size:13px}
.zone-bg{fill:#33414f}

.side{display:grid;gap:16px;position:sticky;top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px}
.card h3{font-size:.95rem;font-weight:600}
.eyebrow{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.sid{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-weight:600}
.status.free{background:var(--free-soft);color:var(--free-deep)}
.status.full{background:var(--full-soft);color:var(--full-deep)}
.status .dot{width:12px;height:12px;border-radius:99px;margin:0}
.empty{color:var(--muted);font-size:.92rem;display:grid;gap:10px;justify-items:start}
.empty .mini{display:flex;gap:4px}
.empty .mini i{width:18px;height:28px;border:2px solid var(--line);border-radius:4px}
.empty .mini i:nth-child(2){background:var(--free);border-color:var(--free)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:600;font-family:var(--display);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.toggle button .dot{margin:0}
.toggle button[data-s="free"][aria-pressed="true"]{background:var(--free);border-color:var(--free);color:#06240f}
.toggle button[data-s="full"][aria-pressed="true"]{background:var(--full);border-color:var(--full);color:#fff}
.plate input{text-transform:uppercase}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.z{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;gap:4px;cursor:pointer;text-align:left}
.z:hover{border-color:var(--muted)}
.z b{font-family:var(--display);font-size:.95rem}
.z span{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.zbar{height:4px;border-radius:99px;background:var(--full);overflow:hidden}
.zbar i{display:block;height:100%;background:var(--free)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:.78rem;color:var(--muted);margin:0}

.savebox{display:flex;align-items:center;gap:8px;font-size:.88rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.savebox .dot{margin:0;background:var(--free)}
.savebox.dirty .dot{background:#f59e0b}
.savebox.busy .dot{background:var(--brand)}
.savebox.bad{background:var(--full-soft);color:var(--full-deep)}
.savebox.bad .dot{background:var(--full)}
.primary.sm{padding:6px 14px;font-size:.86rem;border-radius:99px}
.primary:disabled{opacity:.45;cursor:default;filter:none}
.updated{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ================= ล็อกอิน ================= -->
<section class="login" id="loginView">
  <div class="login-hero">
    <div class="logo"><div class="p-sign">P</div><div><h1>ระบบลานจอดรถ</h1><small>เช็กช่องว่างก่อนเข้าลาน</small></div></div>
    <div class="lot-strip" aria-hidden="true"><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i></div>
  </div>
  <div class="login-body">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabStu" aria-selected="true">นักศึกษา</button>
      <button type="button" role="tab" id="tabAdm" aria-selected="false">ยาม / แอดมิน</button>
    </div>
    <form id="stuForm" novalidate>
      <div class="field">
        <label for="stuId">รหัสนักศึกษา</label>
        <input id="stuId" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="ตัวเลข 10 หลัก">
        <span class="counter" id="cntId">0/10</span>
      </div>
      <div class="field">
        <label for="stuPw">รหัสผ่าน (เลขบัตรประชาชน)</label>
        <input id="stuPw" type="password" inputmode="numeric" maxlength="13" autocomplete="current-password" placeholder="ตัวเลข 13 หลัก">
        <span class="counter" id="cntPw">0/13</span>
      </div>
      <p class="err" id="stuErr"></p>
      <button class="primary" type="submit">เข้าสู่ระบบ</button>
    </form>
    <form id="admForm" novalidate hidden>
      <div class="field">
        <label for="admCode">รหัสเจ้าหน้าที่</label>
        <input id="admCode" type="password" autocomplete="off" placeholder="กรอกรหัสเจ้าหน้าที่">
      </div>
      <p class="err" id="admErr"></p>
      <button class="primary" type="submit">เข้าสู่หน้าจัดการช่องจอด</button>
    </form>
  </div>
</section>

<!-- ================= แอป ================= -->
<div class="wrap" id="appView" hidden>
  <div class="topbar">
    <div class="logo"><div class="p-sign">P</div><div><h1>ผังลานจอดรถ</h1><small id="subText"></small></div></div>
    <div class="who"><span class="role" id="roleTag"></span><b id="whoName"></b><button class="ghost" id="logout" type="button">ออกจากระบบ</button></div>
  </div>

  <section class="summary" aria-label="สรุปความจุ">
    <div>
      <div class="big-lbl">ช่องว่างตอนนี้</div>
      <div class="big"><b id="nFree">0</b><span>/ <span id="nAll">0</span> ช่อง</span></div>
    </div>
    <div class="meter-row">
      <div class="meter" role="img" id="meterLbl"><i id="meter"></i></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--free)"></i>ว่าง <b id="lFree">0</b></span>
        <span><i class="dot" style="background:var(--full)"></i>เต็ม <b id="lFull">0</b></span>
        <span>ใช้ไปแล้ว <b id="lPct">0%</b></span>
        <span class="updated" id="updatedAt"></span>
      </div>
    </div>
  </section>

  <div class="main">
    <section class="mapcard">
      <div class="bar">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="q" placeholder="ค้นหาเลขช่อง เช่น T-05">
        </label>
        <div class="chips" role="group" aria-label="ตัวกรอง">
          <button class="chip" data-f="all" aria-pressed="true">ทั้งหมด</button>
          <button class="chip" data-f="free" aria-pressed="false"><i class="dot" style="background:var(--free);margin:0"></i>ว่าง</button>
          <button class="chip" data-f="full" aria-pressed="false"><i class="dot" style="background:var(--full);margin:0"></i>เต็ม</button>
        </div>
      </div>
      <div class="mapscroll"><svg id="map" viewBox="20 0 1110 1290" role="img" aria-label="ผังลานจอดรถ"></svg></div>
    </section>

    <aside class="side">
      <div class="card" id="detail" aria-live="polite"></div>
      <div class="card">
        <h3>ช่องว่างแยกตามโซน</h3>
        <div class="zones" id="zones"></div>
      </div>
      <div class="card" id="adminTools">
        <h3>บันทึกสถานะ</h3>
        <div class="savebox" id="saveBox"><i class="dot" id="saveDot"></i><span id="saveMsg">ยังไม่มีการเปลี่ยนแปลง</span></div>
        <div class="tools">
          <button class="primary sm" id="saveNow" type="button" disabled>บันทึกตอนนี้</button>
          <button class="ghost" id="clearAll" type="button">ตั้งทุกช่องเป็นว่าง</button>
        </div>
        <p class="note">เปลี่ยนสถานะแล้วระบบบันทึกให้อัตโนมัติภายในไม่กี่วินาที ถ้าเปิดจากไฟล์ สถานะจะเก็บไว้ในเครื่องที่เปิดอยู่</p>
      </div>
    </aside>
  </div>

function decode(d){const out={};for(const k in d.s){const v=d.s[k];out[k]={s:v[0]===1?"full":"free",p:v[1]||""}}return out}
function encode(){const s={};ALL.forEach(id=>{const v=state[id];s[id]=v.s==="full"?(v.p?[1,v.p]:[1]):[0]});return {at:new Date().toISOString(),s}}
function load(){
  // ใช้ข้อมูลที่ใหม่กว่า ระหว่างที่ฝังในไฟล์ กับที่บันทึกไว้ในเครื่องนี้
  let emb=null,loc=null;
  try{const d=JSON.parse($("lotState").textContent);if(d&&d.s)emb=d}catch(e){}
  try{const d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(d&&d.s)loc=d}catch(e){}
  const pick=(emb&&loc)?((loc.at||"")>(emb.at||"")?loc:emb):(loc||emb);
  if(!pick)return null;
  updatedAt=pick.at||null;return decode(pick);
}

function b64ToText(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function buildDoc(){
  const tpl=b64ToText(window.__PAGE_SRC);
  const json=JSON.stringify(encode()).replace(/</g,"\\u003c");
  const P="%%";// แยกตัวอักษรไว้ไม่ให้ตัวแทนในโค้ดถูกแทนค่า
  const body=tpl.split(P+"SRC"+P).join(window.__PAGE_SRC).split(P+"STATE"+P).join(json);
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+body+'</body></html>';
}
async function publishNow(){
  clearTimeout(saveTimer);
  if(!dirty||saving||role!=="admin")return;
  saving=true;setSave("busy","กำลังบันทึก…");
  // บันทึกในเครื่องนี้เสมอ
  let localOk=false;
  try{localStorage.setItem(LOCAL_KEY,JSON.stringify(encode()));localOk=true}catch(e){}
  // ถ้าเปิดจากลิงก์ claude.ai ด้วยบัญชีเจ้าของ/ผู้แก้ไข จะบันทึกให้ทุกคนที่เปิดลิงก์เห็นด้วย
  const shared=artifactNs&&await canWrite();
  if(!shared){
    saving=false;dirty=!localOk;
    setSave(localOk?"":"bad",localOk?"บันทึกในเครื่องนี้แล้ว":"บันทึกไม่ได้ เบราว์เซอร์นี้ปิดการเก็บข้อมูลไว้");
    if(localOk){$("updatedAt").textContent="อัปเดตล่าสุด "+new Date().toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})}
    return;
  }
  try{
    await artifactNs.publish(buildDoc());
    dirty=false;setSave("","บันทึกแล้ว ทุกคนที่เปิดลิงก์เห็นสถานะเดียวกัน");
  }catch(e){
    const c=e&&e.code;
    if(c==="conflict")setSave("busy","มีคนบันทึกก่อนหน้า กำลังโหลดข้อมูลล่าสุด…");
    else if(c==="rate_limited"){setSave("dirty","บันทึกถี่เกินไป จะลองใหม่อีกครั้ง");saving=false;saveTimer=setTimeout(publishNow,8000);return}
    else{dirty=false;setSave("","บันทึกในเครื่องนี้แล้ว")}
  }finally{saving=false}
}

function demo(){
  const s={};let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const pv=["กข","ขค","1กท","2ฒม","3ขจ","ฐฐ","7กพ","9กศ"];
  ALL.forEach(id=>{s[id]=rnd()<.58?{s:"full",p:pv[Math.floor(rnd()*pv.length)]+" "+(1000+Math.floor(rnd()*8999))}:{s:"free",p:""}});
  return s;
}

function applyFilter(){
  const q=$("q").value.trim().toLowerCase();
  ALL.forEach(id=>{const s=state[id];let ok=filter==="all"||s.s===filter;
    if(q)ok=ok&&(id.toLowerCase().includes(q)||(role==="admin"&&(s.p||"").toLowerCase().includes(q)));
    slots[id].g.classList.toggle("dim",!ok);});
}
function stats(){
  const free=ALL.filter(id=>state[id].s==="free").length,full=ALL.length-free;
  const pct=Math.round(full/ALL.length*100);
  $("nFree").textContent=free;$("nAll").textContent=ALL.length;
  $("lFree").textContent=free;$("lFull").textContent=full;$("lPct").textContent=pct+"%";
  $("meter").style.width=(free/ALL.length*100)+"%";
  $("meterLbl").setAttribute("aria-label",`ว่าง ${free} จาก ${ALL.length} ช่อง`);
  $("zones").innerHTML=ZONES.map(z=>{
    const ids=ALL.filter(id=>slots[id].zone===z.id),f=ids.filter(id=>state[id].s==="free").length;
    return `<button class="z" type="button" data-z="${z.id}"><b>${z.id}</b><span>${f}/${ids.length}</span><div class="zbar"><i style="width:${f/ids.length*100}%"></i></div></button>`}).join("");
  $("zones").querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.z+"-";applyFilter()});
}
function detail(){
  const d=$("detail");

  const s=state[selected],o=slots[selected];
  const statusBox=`<div class="status ${s.s}"><i class="dot" style="background:var(--${s.s})"></i>${s.s==="free"?"ช่องนี้ว่าง จอดได้":"ช่องนี้มีรถจอดแล้ว"}</div>`;
  if(role!=="admin"){
    d.innerHTML=`<div class="eyebrow">ช่องที่เลือก · โซน ${o.zone}</div><div class="sid">${selected}</div>${statusBox}`;return}
  d.innerHTML=`<div class="eyebrow">ช่องที่เลือก · โซน ${o.zone}</div><div class="sid">${selected}</div>
   <div class="toggle">
     <button type="button" data-s="free" aria-pressed="${s.s==="free"}"><i class="dot" style="background:var(--free)"></i>ว่าง</button>
     <button type="button" data-s="full" aria-pressed="${s.s==="full"}"><i class="dot" style="background:var(--full)"></i>เต็ม</button>
   </div>
   <div class="field plate"><label for="plate">ทะเบียนรถ (ไม่บังคับ)</label>
     <input id="plate" value="${(s.p||"").replace(/"/g,"&quot;")}" placeholder="เช่น 1กท 1234" ${s.s==="free"?"disabled":""}></div>`;
  d.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    if(s.s===b.dataset.s)return;
    s.s=b.dataset.s;if(s.s==="free")s.p="";update(selected);detail();toast(`ช่อง ${selected} เป็น "${LABEL[s.s]}" แล้ว`)});
  const p=d.querySelector("#plate");p.oninput=()=>{s.p=p.value;save();applyFilter()};
}

$("admForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if($("admCode").value.trim()!==ADMIN_CODE){$("admErr").textContent="รหัสเจ้าหน้าที่ไม่ถูกต้อง";$("admCode").select();return}
  $("admCode").value="";
  enter("admin","ยาม / แอดมิน");
});
$("logout").onclick=()=>{
  if(dirty&&role==="admin")publishNow();
  role=null;try{sessionStorage.removeItem(KEY+"-role")}catch(e){}
  $("appView").hidden=true;$("loginView").hidden=false;
  $("stuId").value="";$("cntId").textContent="0/10";$("cntId").classList.remove("ok");setTab(false);
};
try{const s=JSON.parse(sessionStorage.getItem(KEY+"-role")||"null");
  if(s&&s.r==="student")enter("student",s.name);
  else if(s&&s.r==="admin")enter("admin",s.name);
}catch(e){}
window.addEventListener("beforeunload",e=>{if(dirty&&role==="admin"){e.preventDefault();e.returnValue=""}});
})();
</script>
</body></html>
